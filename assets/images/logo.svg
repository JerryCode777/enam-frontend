<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Logo de ENAM Prep.

    Una cruz médica con el latido recortado en el brazo horizontal: dice
    "salud" de un vistazo (la cruz se reconoce a 40 px) y "medición" al
    acercarse (el ECG, que es lo que hace la app — proyectar tu nota).

    El degradado es el mismo de la cabecera de la app, en la misma diagonal,
    para que el icono y la pantalla de inicio se lean como la misma marca.
  -->
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="0.55" stop-color="#16548C"/>
      <stop offset="1" stop-color="#2E9BD0"/>
    </linearGradient>

    <!-- El latido solo se ve dentro del brazo horizontal de la cruz. -->
    <clipPath id="brazo">
      <rect x="252" y="447" width="520" height="130" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#marca)"/>

  <!-- Círculos de la cabecera, para que el icono no sea un degradado plano. -->
  <circle cx="890" cy="140" r="210" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="130" cy="910" r="160" fill="#FFFFFF" opacity="0.07"/>

  <g>
    <rect x="447" y="252" width="130" height="520" rx="34" fill="#FFFFFF"/>
    <rect x="252" y="447" width="520" height="130" rx="34" fill="#FFFFFF"/>

    <path d="M312 512 H424 L452 476 L488 556 L524 468 L556 540 L582 512 H712"
          fill="none"
          stroke="#16548C"
          stroke-width="30"
          stroke-linecap="round"
          stroke-linejoin="round"
          clip-path="url(#brazo)"/>
  </g>
</svg>
