name: enam_app
description: "ENAM Prep — Preparación para el Examen Nacional de Medicina del Perú"
publish_to: 'none'

version: 1.1.0+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ---------- Estado ----------
  flutter_riverpod: ^3.4.2

  # ---------- Navegación ----------
  go_router: ^17.3.0

  # ---------- Red ----------
  dio: ^5.11.0

  # La línea abierta del modo duelo. Es el único sitio de la app donde el
  # servidor habla sin que se le pregunte: abre la pregunta, avisa de que el
  # rival contestó, cierra el tiempo. Eso no cabe en una petición HTTP.
  web_socket_channel: ^3.0.3

  # ---------- Modelos ----------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---------- Almacenamiento ----------
  # Tokens en Keystore (Android). NUNCA en shared_preferences.
  flutter_secure_storage: ^10.3.1
  # Solo para preferencias no sensibles (tema, ajustes de UI).
  shared_preferences: ^2.5.3
  # Base local para el modo offline (RF-30 a RF-33).
  sqflite: ^2.4.2
  path: ^1.9.1
  # AES-GCM para cifrar los paquetes descargados. La llave vive en el Keychain
  # / Keystore vía flutter_secure_storage, nunca en el binario.
  pointycastle: ^4.0.0

  # ---------- Sonido ----------
  # El mismo paquete y la misma versión que Rumbo, del que vienen los sonidos:
  # un segundo motor de audio solo para siete efectos no se justifica.
  audioplayers: ^6.8.1

  # ---------- UI ----------
  cached_network_image: ^3.4.1

  # Las clases del aula: MP4 H.264 por rango desde CloudFront, con ExoPlayer en
  # Android y AVPlayer en iOS. Los controles y los subtítulos VTT son nuestros
  # (ver features/aula/presentation/reproductor).
  video_player: ^2.14.1
  # La pantalla encendida mientras corre una clase: video_player no lo hace
  # en Android, y sin tocar nada se apagaría a mitad de la clase.
  wakelock_plus: ^1.5.2

  # ---------- Utilidades ----------
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  material_symbols_icons: ^4.2960.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  sign_in_with_apple: ^8.1.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Para poder fabricar un WebSocketChannel falso en los tests del duelo:
  # `StreamChannelMixin` vive aquí y sin declararlo el análisis lo marca como
  # dependencia prestada de otro paquete.
  stream_channel: ^2.1.4

  # Para el video falso de las pruebas del reproductor del aula: sin él no
  # hay forma de probar el progreso ni la URL que caduca sin un dispositivo.
  video_player_platform_interface: ^6.9.0

  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  # SQLite en las pruebas: `flutter test` corre en el escritorio, donde el
  # plugin de sqflite no existe. Esto le da la implementación nativa para que
  # la base local se pruebe de verdad y no contra un doble.
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    # Incluye la figura de marca (doctora_brazos_cruzados.webp y
    # doctora_senala.webp): ilustración generada con IA, WebP con alfa, 46 KB
    # entre las dos. Reglas de uso en lib/shared/widgets/figura_de_marca.dart.
    - assets/images/
    # Los siete sonidos de la interfaz, los de Rumbo. 142 KB en total: los WAV
    # originales se pasaron a MP3 mono de 96 kbps. Ver lib/core/sonido/.
    - assets/sonidos/

  # Nunito va empaquetada, no descargada en el primer arranque.
  #
  # `google_fonts` la bajaba de la red la primera vez. En una app con modo
  # offline eso significa que quien abre la app sin señal ve la tipografía del
  # sistema en vez de la de marca. Además hacía imposibles los tests de
  # captura, que no tienen red.
  #
  # Licencia SIL Open Font 1.1, incluida en assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
