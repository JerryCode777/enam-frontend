name: enam_app
description: "ENAM Prep — Preparación para el Examen Nacional de Medicina del Perú"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ---------- Estado ----------
  flutter_riverpod: ^3.4.2

  # ---------- Navegación ----------
  go_router: ^17.3.0

  # ---------- Red ----------
  dio: ^5.11.0

  # ---------- Modelos ----------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---------- Almacenamiento ----------
  # Tokens en Keystore (Android). NUNCA en shared_preferences.
  flutter_secure_storage: ^10.3.1
  # Solo para preferencias no sensibles (tema, ajustes de UI).
  shared_preferences: ^2.5.3
  # Base local para el modo offline (RF-30 a RF-33).
  sqflite: ^2.4.2
  path: ^1.9.1

  # ---------- UI ----------
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1

  # ---------- Utilidades ----------
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  material_symbols_icons: ^4.2960.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
