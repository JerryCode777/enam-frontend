name: enam_app
description: "ENAM Prep — Preparación para el Examen Nacional de Medicina del Perú"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ---------- Estado ----------
  flutter_riverpod: ^3.4.2

  # ---------- Navegación ----------
  go_router: ^17.3.0

  # ---------- Red ----------
  dio: ^5.11.0

  # ---------- Modelos ----------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---------- Almacenamiento ----------
  # Tokens en Keystore (Android). NUNCA en shared_preferences.
  flutter_secure_storage: ^10.3.1
  # Solo para preferencias no sensibles (tema, ajustes de UI).
  shared_preferences: ^2.5.3
  # Base local para el modo offline (RF-30 a RF-33).
  sqflite: ^2.4.2
  path: ^1.9.1

  # ---------- UI ----------
  cached_network_image: ^3.4.1

  # ---------- Utilidades ----------
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  material_symbols_icons: ^4.2960.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Nunito va empaquetada, no descargada en el primer arranque.
  #
  # `google_fonts` la bajaba de la red la primera vez. En una app con modo
  # offline eso significa que quien abre la app sin señal ve la tipografía del
  # sistema en vez de la de marca. Además hacía imposibles los tests de
  # captura, que no tienen red.
  #
  # Licencia SIL Open Font 1.1, incluida en assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
